name: platforms

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Compile every target on the host platform
        run: cargo check --workspace --all-targets
      - name: Run workspace tests
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-targets
      - name: Reproduce bounded-event shutdown sequence on Windows
        if: runner.os == 'Windows'
        # Steam Audio's Windows DLL can fault when independent test cases create
        # and release process-level contexts concurrently. The suite still covers
        # multiple simultaneous PetalSonic worlds inside one dedicated test.
        run: cargo test -p petalsonic --lib world::tests::bounded_event_pressure_then_detached_shutdown -- --exact --test-threads=1 --nocapture
        continue-on-error: true
      - name: Run complete workspace tests serially on Windows
        if: runner.os == 'Windows'
        run: cargo test --workspace --all-targets -- --test-threads=1 --nocapture
